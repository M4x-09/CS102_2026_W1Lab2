<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">hafizun.uz Instagram profile icon</title>
  <desc id="desc">Circular-crop-safe standalone Signal Bridge H monogram on a clean light background.</desc>
  <defs>
    <linearGradient id="iconBridge" x1="98" y1="194" x2="262" y2="142" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2764FF"/>
      <stop offset="1" stop-color="#15C7B7"/>
    </linearGradient>
    <radialGradient id="iconBackdrop" cx="50%" cy="46%" r="66%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.72" stop-color="#F7FAFF"/>
      <stop offset="1" stop-color="#EAF2FF"/>
    </radialGradient>
    <filter id="iconShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2764FF" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="#EEF4FF"/>
  <!-- This circle sits entirely inside Instagram's circular crop. -->
  <circle cx="540" cy="540" r="438" fill="url(#iconBackdrop)" stroke="#DCE7FA" stroke-width="4"/>

  <g transform="translate(162 162) scale(2.1)" filter="url(#iconShadow)" shape-rendering="geometricPrecision">
    <rect x="64" y="44" width="68" height="272" rx="34" fill="#2764FF"/>
    <rect x="228" y="44" width="68" height="272" rx="34" fill="#15C7B7"/>
    <path d="M98 194C137 194 153 194 176 184C210 170 228 142 262 142" fill="none" stroke="url(#iconBridge)" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="262" cy="142" r="15" fill="#FF6B5E" stroke="#FFFFFF" stroke-width="7"/>
  </g>
</svg>
