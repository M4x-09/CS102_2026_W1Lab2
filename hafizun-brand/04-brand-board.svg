<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280" role="img" aria-labelledby="title desc">
  <title id="title">hafizun.uz visual identity brand board</title>
  <desc id="desc">A polished presentation of the Signal Bridge logo, Instagram icon, colors, typography, and concept.</desc>
  <defs>
    <linearGradient id="boardBridge" x1="98" y1="194" x2="262" y2="142" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2764FF"/>
      <stop offset="1" stop-color="#15C7B7"/>
    </linearGradient>
    <radialGradient id="boardHalo" cx="50%" cy="45%" r="64%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF2FF"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#193B77" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1920" height="1280" fill="#F4F8FE"/>

  <!-- Header -->
  <text x="80" y="78" fill="#14233B" font-family="'Noto Sans', Arial, sans-serif" font-size="42" font-weight="760" letter-spacing="-1.5">hafizun<tspan fill="#FF6B5E">.</tspan><tspan fill="#2764FF">uz</tspan></text>
  <text x="80" y="116" fill="#63718A" font-family="'Noto Sans', Arial, sans-serif" font-size="17" font-weight="650" letter-spacing="4">VISUAL IDENTITY / SIGNAL BRIDGE</text>
  <text x="1840" y="82" text-anchor="end" fill="#63718A" font-family="'Noto Sans', Arial, sans-serif" font-size="18" font-weight="620" letter-spacing="2">DIGITAL CREATIVE AGENCY</text>

  <!-- Primary lockup card -->
  <rect x="80" y="160" width="1120" height="570" rx="36" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <text x="126" y="216" fill="#8A96AA" font-family="'Noto Sans', Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">PRIMARY LOGO</text>

  <g transform="translate(138 268) scale(1.08)" shape-rendering="geometricPrecision">
    <rect x="64" y="44" width="68" height="272" rx="34" fill="#2764FF"/>
    <rect x="228" y="44" width="68" height="272" rx="34" fill="#15C7B7"/>
    <path d="M98 194C137 194 153 194 176 184C210 170 228 142 262 142" fill="none" stroke="url(#boardBridge)" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="262" cy="142" r="15" fill="#FF6B5E" stroke="#FFFFFF" stroke-width="7"/>
  </g>

  <text x="554" y="480" fill="#14233B" font-family="'Noto Sans', Arial, sans-serif" font-size="105" font-weight="760" letter-spacing="-4">
    <tspan>hafizun</tspan><tspan fill="#FF6B5E" font-size="74" letter-spacing="-1">.</tspan><tspan fill="#2764FF" font-size="74" font-weight="720" letter-spacing="-1">uz</tspan>
  </text>
  <text x="560" y="535" fill="#63718A" font-family="'Noto Sans', Arial, sans-serif" font-size="17" font-weight="650" letter-spacing="5">DIGITAL CREATIVE AGENCY</text>
  <rect x="560" y="570" width="100" height="6" rx="3" fill="#15C7B7"/>
  <rect x="660" y="570" width="60" height="6" rx="3" fill="#E1E9F8"/>
  <text x="560" y="625" fill="#7A879D" font-family="'Noto Sans', Arial, sans-serif" font-size="18" font-weight="450">Designed to read clearly from a storefront header</text>
  <text x="560" y="655" fill="#7A879D" font-family="'Noto Sans', Arial, sans-serif" font-size="18" font-weight="450">to a compact mobile interface.</text>

  <!-- Instagram application card -->
  <rect x="1240" y="160" width="600" height="570" rx="36" fill="#EAF2FF" filter="url(#cardShadow)"/>
  <text x="1286" y="216" fill="#7184A4" font-family="'Noto Sans', Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">INSTAGRAM ICON</text>
  <circle cx="1540" cy="442" r="218" fill="url(#boardHalo)" stroke="#D8E5FA" stroke-width="3"/>
  <circle cx="1540" cy="442" r="245" fill="none" stroke="#BFCFEA" stroke-width="2" stroke-dasharray="8 12" opacity="0.8"/>
  <g transform="translate(1360 262)" shape-rendering="geometricPrecision">
    <rect x="64" y="44" width="68" height="272" rx="34" fill="#2764FF"/>
    <rect x="228" y="44" width="68" height="272" rx="34" fill="#15C7B7"/>
    <path d="M98 194C137 194 153 194 176 184C210 170 228 142 262 142" fill="none" stroke="url(#boardBridge)" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="262" cy="142" r="15" fill="#FF6B5E" stroke="#FFFFFF" stroke-width="7"/>
  </g>
  <text x="1540" y="697" text-anchor="middle" fill="#7184A4" font-family="'Noto Sans', Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="2">CIRCULAR-CROP SAFE</text>

  <!-- Palette card -->
  <rect x="80" y="770" width="900" height="430" rx="36" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <text x="126" y="827" fill="#8A96AA" font-family="'Noto Sans', Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">COLOR SYSTEM</text>

  <rect x="126" y="866" width="220" height="154" rx="24" fill="#2764FF"/>
  <text x="148" y="1058" fill="#14233B" font-family="'Noto Sans', Arial, sans-serif" font-size="20" font-weight="720">Electric Blue</text>
  <text x="148" y="1089" fill="#63718A" font-family="'Noto Sans', Arial, sans-serif" font-size="18" font-weight="520">#2764FF</text>

  <rect x="378" y="866" width="220" height="154" rx="24" fill="#15C7B7"/>
  <text x="400" y="1058" fill="#14233B" font-family="'Noto Sans', Arial, sans-serif" font-size="20" font-weight="720">Signal Turquoise</text>
  <text x="400" y="1089" fill="#63718A" font-family="'Noto Sans', Arial, sans-serif" font-size="18" font-weight="520">#15C7B7</text>

  <rect x="630" y="866" width="220" height="154" rx="24" fill="#FF6B5E"/>
  <text x="652" y="1058" fill="#14233B" font-family="'Noto Sans', Arial, sans-serif" font-size="20" font-weight="720">Warm Coral</text>
  <text x="652" y="1089" fill="#63718A" font-family="'Noto Sans', Arial, sans-serif" font-size="18" font-weight="520">#FF6B5E</text>

  <circle cx="138" cy="1152" r="12" fill="#14233B"/>
  <text x="160" y="1159" fill="#63718A" font-family="'Noto Sans', Arial, sans-serif" font-size="16" font-weight="550">Ink #14233B</text>
  <circle cx="328" cy="1152" r="12" fill="#F7FAFF" stroke="#DDE6F4" stroke-width="2"/>
  <text x="350" y="1159" fill="#63718A" font-family="'Noto Sans', Arial, sans-serif" font-size="16" font-weight="550">Cloud #F7FAFF</text>

  <!-- Typography and concept card -->
  <rect x="1020" y="770" width="820" height="430" rx="36" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <text x="1066" y="827" fill="#8A96AA" font-family="'Noto Sans', Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">TYPE + IDEA</text>
  <text x="1066" y="915" fill="#14233B" font-family="'Noto Sans', Arial, sans-serif" font-size="64" font-weight="760" letter-spacing="-2">Sora</text>
  <text x="1068" y="958" fill="#63718A" font-family="'Noto Sans', Arial, sans-serif" font-size="18" font-weight="520">Headlines &amp; brand moments / 600–700</text>
  <text x="1066" y="1032" fill="#14233B" font-family="'Noto Sans', Arial, sans-serif" font-size="42" font-weight="520" letter-spacing="-1">Inter for every interface.</text>
  <line x1="1066" y1="1075" x2="1792" y2="1075" stroke="#E5EBF5" stroke-width="2"/>
  <text x="1066" y="1117" fill="#63718A" font-family="'Noto Sans', Arial, sans-serif" font-size="17" font-weight="520">Two stable rails form an H. The rising bridge turns an idea into</text>
  <text x="1066" y="1147" fill="#63718A" font-family="'Noto Sans', Arial, sans-serif" font-size="17" font-weight="520">a connected digital product; the coral node marks launch and growth.</text>
</svg>
