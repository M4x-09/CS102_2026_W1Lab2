<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hafizun.uz — Signal Bridge identity</title>
  <style>
    :root { color-scheme: light; --ink:#14233B; --slate:#63718A; --cloud:#F7FAFF; --blue:#2764FF; }
    * { box-sizing: border-box; }
    body { margin:0; background:#EEF4FC; color:var(--ink); font-family:"Noto Sans",Arial,sans-serif; }
    main { width:min(1440px, calc(100% - 40px)); margin:40px auto 72px; }
    header { display:flex; justify-content:space-between; align-items:end; margin:0 4px 24px; gap:24px; }
    h1 { margin:0; font-size:clamp(28px,4vw,52px); letter-spacing:-.04em; }
    h1 i { color:#FF6B5E; font-style:normal; } h1 b { color:#2764FF; }
    header p { margin:0 0 8px; color:var(--slate); letter-spacing:.15em; font-size:12px; font-weight:700; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
    figure { margin:0; padding:18px; border:1px solid #DEE7F3; border-radius:28px; background:#fff; box-shadow:0 18px 50px rgba(25,59,119,.07); }
    figure.wide { grid-column:1/-1; }
    img { display:block; width:100%; height:auto; border-radius:16px; }
    figcaption { color:var(--slate); padding:14px 6px 2px; font-size:14px; font-weight:650; }
    footer { margin-top:24px; color:var(--slate); text-align:center; font-size:13px; }
    @media (max-width:760px) { .grid { grid-template-columns:1fr; } figure.wide { grid-column:auto; } header { align-items:start; flex-direction:column; } }
  </style>
</head>
<body>
  <main>
    <header><h1>hafizun<i>.</i><b>uz</b></h1><p>SIGNAL BRIDGE / VISUAL IDENTITY</p></header>
    <section class="grid">
      <figure class="wide"><img src="04-brand-board.svg" alt="Complete hafizun.uz brand identity board"><figcaption>Complete identity system</figcaption></figure>
      <figure><img src="01-primary-logo.svg" alt="Primary hafizun.uz logo"><figcaption>Primary square logo</figcaption></figure>
      <figure><img src="02-instagram-profile-icon.svg" alt="Instagram profile icon"><figcaption>Instagram profile icon</figcaption></figure>
      <figure><img src="05-standalone-symbol.svg" alt="Standalone hafizun.uz symbol"><figcaption>Transparent standalone symbol</figcaption></figure>
      <figure class="wide"><img src="03-horizontal-logo.svg" alt="Horizontal hafizun.uz logo"><figcaption>Horizontal logo</figcaption></figure>
    </section>
    <footer>Original vector identity created for hafizun.uz · No stock symbols or templates</footer>
  </main>
</body>
</html>
